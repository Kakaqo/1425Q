<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>マス塗り分けツール</title>
<style>
  :root{
    --ink:#20242c;
    --panel:#ffffff;
    --bg:#eef1f5;
    --line:#d7dce3;
    --accent:#2f6f6a;
    --accent-ink:#ffffff;
    --danger:#b3532c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Roboto,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    padding:14px 16px 10px;
  }
  h1{
    font-size:17px;
    margin:0 0 4px;
    font-weight:700;
  }
  p.desc{
    margin:0;
    font-size:12.5px;
    color:#5b6472;
    line-height:1.5;
  }
  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 14px;
  }
  .swatch-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .swatch-row label{
    font-size:12px;
    color:#5b6472;
    white-space:nowrap;
  }
  input[type="color"]{
    width:44px;
    height:36px;
    padding:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:none;
    cursor:pointer;
  }
  .presets{
    display:flex;
    gap:6px;
  }
  .preset{
    width:26px;
    height:26px;
    border-radius:6px;
    border:1px solid rgba(0,0,0,0.15);
    cursor:pointer;
    padding:0;
  }
  .spacer{flex:1;}
  button.action{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  button.action:active{
    background:#f0f2f5;
  }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  button.primary:active{
    background:#265a56;
  }
  button.danger{
    color:var(--danger);
    border-color:#e8c9ba;
  }
  main{
    padding:14px;
    display:flex;
    justify-content:center;
  }
  .board-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    max-width:920px;
    width:100%;
  }
  #board{
    display:block;
    width:100%;
    height:auto;
    border-radius:4px;
    touch-action:manipulation;
    cursor:crosshair;
  }
  .hint{
    text-align:center;
    font-size:11.5px;
    color:#8a93a1;
    padding:2px 0 16px;
  }
  @media (max-width:480px){
    h1{font-size:15.5px;}
    p.desc{font-size:11.5px;}
    button.action{padding:8px 11px;font-size:12.5px;}
  }
</style>
</head>
<body>

<header>
  <h1>マス塗り分けツール</h1>
  <p class="desc">マスをタップすると選んだ色で塗られます。塗られたマスをもう一度タップすると色が消えて元の白色に戻ります。</p>
</header>

<div class="toolbar">
  <div class="swatch-row">
    <label for="colorPicker">色</label>
    <input type="color" id="colorPicker" value="#e0663f">
  </div>
  <div class="presets" id="presets"></div>
  <div class="spacer"></div>
  <button class="action" id="undoBtn">元に戻す</button>
  <button class="action danger" id="resetBtn">リセット</button>
  <button class="action primary" id="saveBtn">保存</button>
</div>

<main>
  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>
</main>
<p class="hint">スマホ・タブレットのブラウザ(Chrome / Safari)でそのまま使えます</p>

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const colorPicker = document.getElementById('colorPicker');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const saveBtn = document.getElementById('saveBtn');
  const presetsWrap = document.getElementById('presets');

  const PRESETS = ['#e0663f','#4f8ac9','#5aa06b','#e0b23f','#9b6bb5','#3d3d3d'];
  PRESETS.forEach(hex=>{
    const b = document.createElement('button');
    b.className = 'preset';
    b.style.background = hex;
    b.title = hex;
    b.addEventListener('click', ()=>{ colorPicker.value = hex; });
    presetsWrap.appendChild(b);
  });

  let baseImage = new Image();
  let undoStack = [];
  const MAX_UNDO = 30;
  const TOLERANCE = 48;      // color-distance tolerance for the fill boundary
  const WHITE_MIN = 245;     // channel value above which a pixel counts as "empty / unpainted"
  const BORDER_MAX = 80;     // channel value below which a pixel counts as "a line" (ignore clicks there)

  baseImage.onload = function(){
    canvas.width = baseImage.naturalWidth;
    canvas.height = baseImage.naturalHeight;
    ctx.drawImage(baseImage, 0, 0);
  };
  baseImage.src = IMG_SRC;

  function hexToRgb(hex){
    const v = parseInt(hex.slice(1), 16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }

  function pushUndo(){
    try{
      const snap = ctx.getImageData(0,0,canvas.width, canvas.height);
      undoStack.push(snap);
      if(undoStack.length > MAX_UNDO){ undoStack.shift(); }
    }catch(e){ /* ignore */ }
  }

  function getCanvasPixel(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = Math.floor((clientX - rect.left) * scaleX);
    const y = Math.floor((clientY - rect.top) * scaleY);
    return [x, y];
  }

  function colorDist(data, idx, r, g, b){
    const dr = data[idx] - r;
    const dg = data[idx+1] - g;
    const db = data[idx+2] - b;
    return Math.abs(dr) + Math.abs(dg) + Math.abs(db);
  }

  function floodFill(startX, startY, fillRgb){
    const w = canvas.width, h = canvas.height;
    if(startX < 0 || startY < 0 || startX >= w || startY >= h) return false;

    const imageData = ctx.getImageData(0,0,w,h);
    const data = imageData.data;

    const startIdx = (startY * w + startX) * 4;
    const targetR = data[startIdx], targetG = data[startIdx+1], targetB = data[startIdx+2];
    const [fr, fg, fb] = fillRgb;

    if (Math.abs(targetR-fr)+Math.abs(targetG-fg)+Math.abs(targetB-fb) < 6) return false;

    const visited = new Uint8Array(w*h);
    const stack = [[startX, startY]];

    while(stack.length){
      const [cx, rowY] = stack.pop();
      let x1 = cx;
      const idxRow = rowY * w;

      while(x1 >= 0 && !visited[idxRow+x1] && colorDist(data,(idxRow+x1)*4, targetR, targetG, targetB) <= TOLERANCE){
        x1--;
      }
      x1++;

      let x2 = cx;
      while(x2 < w && !visited[idxRow+x2] && colorDist(data,(idxRow+x2)*4, targetR, targetG, targetB) <= TOLERANCE){
        x2++;
      }
      x2--;

      if(x2 < x1) continue;

      let spanAboveAdded = false;
      let spanBelowAdded = false;

      for(let x = x1; x <= x2; x++){
        const pos = idxRow + x;
        if(visited[pos]) continue;
        visited[pos] = 1;
        const di = pos*4;
        data[di] = fr; data[di+1] = fg; data[di+2] = fb; data[di+3] = 255;

        if(rowY > 0){
          const aboveIdx = pos - w;
          const match = !visited[aboveIdx] && colorDist(data, aboveIdx*4, targetR, targetG, targetB) <= TOLERANCE;
          if(match && !spanAboveAdded){ stack.push([x, rowY-1]); spanAboveAdded = true; }
          if(!match) spanAboveAdded = false;
        }
        if(rowY < h-1){
          const belowIdx = pos + w;
          const match = !visited[belowIdx] && colorDist(data, belowIdx*4, targetR, targetG, targetB) <= TOLERANCE;
          if(match && !spanBelowAdded){ stack.push([x, rowY+1]); spanBelowAdded = true; }
          if(!match) spanBelowAdded = false;
        }
      }
    }

    ctx.putImageData(imageData, 0, 0);
    return true;
  }

  canvas.addEventListener('click', function(evt){
    const [x, y] = getCanvasPixel(evt.clientX, evt.clientY);
    if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

    const px = ctx.getImageData(x, y, 1, 1).data;
    const brightness = (px[0] + px[1] + px[2]) / 3;

    // clicked directly on a border line: ignore, to avoid painting the grid lines
    if(px[0] < BORDER_MAX && px[1] < BORDER_MAX && px[2] < BORDER_MAX){
      return;
    }

    const isEmpty = px[0] >= WHITE_MIN && px[1] >= WHITE_MIN && px[2] >= WHITE_MIN;
    const fillRgb = isEmpty ? hexToRgb(colorPicker.value) : [255,255,255];

    pushUndo();
    const changed = floodFill(x, y, fillRgb);
    if(!changed){ undoStack.pop(); }
  });

  undoBtn.addEventListener('click', function(){
    if(undoStack.length === 0) return;
    const prev = undoStack.pop();
    ctx.putImageData(prev, 0, 0);
  });

  resetBtn.addEventListener('click', function(){
    if(!confirm('すべての塗り色を消して元の画像に戻しますか?')) return;
    undoStack = [];
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(baseImage, 0, 0);
  });

  saveBtn.addEventListener('click', function(){
    const link = document.createElement('a');
    link.download = 'masu-nurie.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

})();
